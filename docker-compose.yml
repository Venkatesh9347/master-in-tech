# ---------------------------------------------------------------------------
# MasterInTech - development Docker environment
#
#   Start:          docker compose up -d
#   Logs:           docker compose logs -f backend frontend
#   Migrate DB:     docker compose exec backend php artisan migrate
#   Stop:           docker compose down
#   Reset volumes:  docker compose down -v
#
# Dev addresses (override ports with env vars):
#   Frontend SPA : http://localhost:5173   (nginx; /api proxied to backend)
#   Backend API  : http://localhost:8001/api
#   MySQL        : localhost:3306   (db=masterintech, user/pass=masterintech)
#   Redis        : localhost:6379
#   Mailpit UI   : http://localhost:8025   (SMTP on localhost:1025)
#
# No production credentials live here - all secrets come from your own
# environment/.env in real deployments (see DEPLOYMENT.md).
# ---------------------------------------------------------------------------

name: masterintech-dev

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: masterintech
      MYSQL_USER: masterintech
      MYSQL_PASSWORD: masterintech
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  backend:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    image: masterintech-backend:dev
    entrypoint: ["/usr/local/bin/docker-entrypoint"]
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8001"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8001
      FRONTEND_URL: http://localhost:5173
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: masterintech
      DB_USERNAME: masterintech
      DB_PASSWORD: masterintech
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "false"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: dev@mailpit.local
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SANCTUM_STATEFUL_DOMAINS: "localhost,localhost:3000,127.0.0.1,::1"
      SECURITY_HSTS_FORCE: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    volumes:
      - ./backend/storage:/var/www/storage

  worker:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    image: masterintech-backend:dev
    entrypoint: ["/usr/local/bin/docker-entrypoint"]
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8001
      FRONTEND_URL: http://localhost:5173
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: masterintech
      DB_USERNAME: masterintech
      DB_PASSWORD: masterintech
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: dev@mailpit.local
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
    volumes:
      - ./backend/storage:/var/www/storage

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
      args:
        # Browser-facing API origin (nginx proxies /api to the backend service
        # in the same compose network).
        VITE_API_URL: http://localhost:5173/api
    image: masterintech-frontend:dev
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data: