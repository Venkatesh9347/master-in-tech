# MasterInTech dev frontend nginx configuration.
#
# - Serves the static Vite build.
# - Rewrites unknown paths to /index.html so react-router deep links work
#   (this is the "SPA rewrite" requirement for any static host).
# - Proxies /api to the backend service. In production, terminate TLS in front
#   of this and set TRUSTED_PROXIES on the backend (see DEPLOYMENT.md).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API reverse proxy (dev compose only - the SPA must reach the backend).
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-lived assets.
    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}