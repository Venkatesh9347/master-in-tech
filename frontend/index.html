<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- B10: static defaults for non-executing crawlers. Per-route titles and
         descriptions are applied at runtime by src/hooks/usePageMeta.ts, which
         cannot be read by a crawler that does not execute JavaScript. -->
    <meta
      name="description"
      content="MasterInTech teaches in-demand tech skills through mentor-led bootcamps, structured industry curriculums, hands-on capstones and verifiable career credentials."
    />
    <title>MasterInTech — Technology Education</title>

    <meta property="og:site_name" content="MasterInTech" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MasterInTech — Technology Education" />
    <meta
      property="og:description"
      content="MasterInTech teaches in-demand tech skills through mentor-led bootcamps, structured industry curriculums, hands-on capstones and verifiable career credentials."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MasterInTech — Technology Education" />
    <meta
      name="twitter:description"
      content="MasterInTech teaches in-demand tech skills through mentor-led bootcamps, structured industry curriculums, hands-on capstones and verifiable career credentials."
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- MasterInTech motion gate.
         Sets data-motion="on" before first paint so entrance animations never
         flash unstyled. If this script fails or JavaScript is disabled, the
         attribute is absent, the hidden-state rules in src/styles/motion.css
         never match, and every element renders fully visible. Animation
         therefore enhances content and can never decide whether it exists. -->
    <script>
      (function () {
        try {
          var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          document.documentElement.setAttribute('data-motion', reduce ? 'reduced' : 'on');
        } catch (e) {
          /* left unset on purpose: static, fully readable fallback */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
